<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跑团</title>
<style>
  :root {
    --bg: #14161f;
    --card: #1b1e2b;
    --fg: #e6e9f5;
    --dim: #8b93ab;
    --line: #262a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.75;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  .head {
    border-left: 4px solid #5a8cff;
    padding: 4px 0 4px 16px;
    margin-bottom: 8px;
  }
  .head h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; letter-spacing: .5px; }
  .head .meta { color: var(--dim); font-size: 13px; }
  .chips { margin: 16px 0 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 13px; padding: 3px 12px; border-radius: 999px;
    color: var(--c); border: 1px solid var(--c);
    background: color-mix(in srgb, var(--c) 12%, transparent);
  }
  .daymark {
    text-align: center; color: var(--dim); font-size: 12px;
    margin: 28px 0 16px; letter-spacing: 2px;
    position: relative;
  }
  .daymark::before, .daymark::after {
    content: ""; position: absolute; top: 50%; width: 32%;
    height: 1px; background: var(--line);
  }
  .daymark::before { left: 0; }
  .daymark::after { right: 0; }
  .line {
    display: flex; gap: 12px; padding: 6px 14px;
    margin: 3px 0; border-radius: 8px;
    border-left: 3px solid transparent;
  }
  .who {
    flex: 0 0 auto; min-width: 4.5em; max-width: 7em;
    font-weight: 700; color: var(--c, var(--dim));
    font-size: 15px;
    word-break: break-all;
  }
  .body { flex: 1 1 auto; min-width: 0; word-break: break-word; }
  .talk { }
  .talk .talk-body {
    color: #fff;
    background: color-mix(in srgb, var(--c) 14%, transparent);
    border-radius: 6px; padding: 4px 12px;
  }
  .act { }
  .act .body em { color: #c9d1e6; font-style: italic; }
  .think .think-body { color: #9aa6c9; font-style: italic; }
  .aside { padding-left: 6px; }
  .aside-body { color: var(--dim); font-size: 14px; }
  .scene {
    justify-content: center; padding: 14px 10px;
    color: #7fd4c1; font-weight: 600; text-align: center;
  }
  .scene .body { flex: 0 1 auto; letter-spacing: 1px; }
  .roll {
    background: #161925; border-radius: 8px;
    padding: 5px 14px; align-items: baseline;
  }
  .rolltm { color: #5a6480; font-size: 12px; flex: 0 0 auto; }
  .rollbody { flex: 1 1 auto; color: #b9c3de; font-size: 14px; }
  .roll code {
    background: #232838; color: #ffd93d;
    padding: 1px 7px; border-radius: 5px; font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .foot { margin-top: 40px; text-align: center; color: #4a5169; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>跑团</h1>
    <div class="meta">2026-10-07 02:13 ~ 2026-10-07 02:15 · 共 6 条记录</div>
  </div>
  <div class="chips"><span class="chip" style="--c:#0abde3">蓝</span></div>
  <div class="daymark">2026-10-07</div>
<div class="line aside"><span class="body aside-body">蓝：（1）</span></div>
<div class="line talk" style="--c:#0abde3"><span class="who">蓝</span><span class="body talk-body">“2”</span></div>
<div class="line think" style="--c:#0abde3"><span class="who">蓝</span><span class="body think-body">【3】</span></div>
<div class="line roll"><span class="rolltm">02:13</span><span class="rollbody">蓝 <code>侦查(75) ➜ 40 [成功]</code></span></div>
<div class="line roll"><span class="rolltm">02:13</span><span class="rollbody">蓝 <code>神秘学(5) ➜ 54 [失败]</code></span></div>
<div class="line roll"><span class="rolltm">02:15</span><span class="rollbody">蓝 <code>1d3/1d6 ➜ 72 [失败]</code></span></div>
  <div class="foot">Generated by COC 骰娘 · 剧本风着色器</div>
</div>
</body>
</html>
